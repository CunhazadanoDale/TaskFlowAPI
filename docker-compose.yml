version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5551:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_network
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - task_network

volumes:
  postgres_data:

networks:
  task_network:
    driver: bridge